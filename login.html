<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · SuryaLab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">SL</div>
      <div class="brand-name">Surya Lab</div>
      <div class="brand-sub">Diagnostic Centre</div>
    </div>

    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pwd-row">
          <input type="password" id="password" autocomplete="current-password" required>
          <button type="button" class="toggle-pwd" id="togglePwd" aria-label="Show password">👁</button>
        </div>
      </div>
      <div class="login-error" id="loginError"></div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>

    <p class="muted" style="margin-top:16px;text-align:center;">
      Demo — admin / admin123 &nbsp;·&nbsp; staff / staff123
    </p>
  </div>
</div>

<script src="app.js"></script>
<script>
  // If already logged in, skip straight to dashboard
  if (SuryaDB.currentUser()) window.location.href = 'dashboard.html';

  document.getElementById('togglePwd').addEventListener('click', () => {
    const pwd = document.getElementById('password');
    const btn = document.getElementById('togglePwd');
    const showing = pwd.type === 'text';
    pwd.type = showing ? 'password' : 'text';
    btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  });

  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const user = SuryaDB.login(username, password);
    const errorBox = document.getElementById('loginError');
    if (user){
      errorBox.textContent = '';
      window.location.href = 'dashboard.html';
    } else {
      errorBox.textContent = 'Incorrect username or password.';
    }
  });
</script>
</body>
</html>
