<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Report · SuryaLab</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

<div class="app-shell">

<nav class="sidebar no-print" id="sidebar"></nav>

<main class="main">

<div class="topbar no-print" id="topbar"></div>

<h1 class="no-print">Lab Report</h1>

<p class="muted no-print">
Search a patient, enter results, then print or share.
</p>

<div class="panel no-print">

<label class="muted">
Search by Invoice Number or Patient Name
</label>

<div style="display:flex;gap:10px;margin-top:10px;">

<input
id="searchBox"
type="text"
placeholder="SL-0001 or Patient Name"
style="flex:1;padding:12px;border:1px solid #ccc;border-radius:8px;">

<button
id="searchBtn"
class="btn btn-primary">
Search
</button>

</div>

<div id="searchResults" style="margin-top:15px;"></div>

</div>

<div id="reportArea" style="display:none;">

<div class="panel no-print">

<button class="btn btn-primary" id="saveResultsBtn">
Save Results
</button>

<button class="btn btn-outline" id="printReportBtn">
Print
</button>

<button class="btn btn-outline" id="downloadPdfBtn">
PDF
</button>

<button class="btn btn-outline" id="whatsappBtn">
WhatsApp
</button>

</div>
<div class="report-ticket" id="ticket">

<div class="ticket-head">

<div>

<div class="lab-name">🧪 Surya Lab</div>

<div class="muted">
Diagnostic Centre
</div>

</div>

<div class="mono muted" id="ticketInvoice"></div>

</div>

<div class="ticket-meta">

<div>
<span>Patient :</span>
<strong id="mName"></strong>
</div>

<div>
<span>Date :</span>
<strong id="mDate"></strong>
</div>

<div>
<span>Age / Sex :</span>
<strong id="mAgeSex"></strong>
</div>

<div>
<span>Doctor :</span>
<strong id="mDoctor"></strong>
</div>

</div>

<table class="result-table">

<thead>
<tr>
<th>Test</th>
<th>Result</th>
<th>Unit</th>
<th>Normal Range</th>
</tr>
</thead>

<tbody id="resultRows">
</tbody>

</table>

<p class="muted" style="margin-top:18px;font-size:12px;">
Generated by SuryaLab · Not valid without lab signature.
</p>

</div>

</div>

</main>

</div>

<script src="app.js"></script>

<script>
SuryaDB.requireAuth('../');
renderShell('../','report');

let currentPatient=null;
function renderSearchResults(query){

const box=document.getElementById("searchResults");

box.innerHTML="";

if(!query.trim()) return;

const patients=SuryaDB.getPatients();

const matches=patients.filter(p=>
p.invoiceNo.toLowerCase().includes(query.toLowerCase())||
p.name.toLowerCase().includes(query.toLowerCase())
);

if(matches.length===0){

box.innerHTML="<p class='muted'>No matching patient.</p>";

return;

}

matches.forEach(p=>{

const div=document.createElement("div");

div.className="menu-tile";

div.style.cursor="pointer";

div.style.marginBottom="10px";

div.innerHTML=`
<strong>${p.name}</strong><br>
<span class="mono">${p.invoiceNo}</span>
`;

div.onclick=()=>loadPatient(p.id);

box.appendChild(div);

});

}

document.getElementById("searchBtn").addEventListener("click",()=>{

renderSearchResults(document.getElementById("searchBox").value);

});

document.getElementById("searchBox").addEventListener("keydown",e=>{

if(e.key==="Enter"){

e.preventDefault();

renderSearchResults(e.target.value);

}

});
function loadPatient(id){

currentPatient = SuryaDB.getPatient(id);

if(!currentPatient) return;

document.getElementById("reportArea").style.display = "block";

document.getElementById("ticketInvoice").textContent = currentPatient.invoiceNo;

document.getElementById("mName").textContent = currentPatient.name;

document.getElementById("mDate").textContent = formatDateDisplay(currentPatient.date);

document.getElementById("mAgeSex").textContent =
currentPatient.age + " / " + currentPatient.sex;

document.getElementById("mDoctor").textContent =
currentPatient.doctor || "-";

const tests = SuryaDB.getTests();

const existing = SuryaDB.getResultsForPatient(currentPatient.id);

document.getElementById("resultRows").innerHTML = "";

currentPatient.testIds.forEach(tid=>{

const t = tests.find(x=>x.id===tid);

if(!t) return;

const old = existing.find(r=>r.testId===tid);

document.getElementById("resultRows").innerHTML += `
<tr>
<td>${t.name}</td>

<td>
<input
class="result-input"
data-test="${t.id}"
value="${old ? old.result : ''}"
style="width:100%;padding:6px;">
</td>

<td>${t.unit}</td>

<td>${t.range}</td>

</tr>
`;

});

}
document.getElementById("saveResultsBtn").addEventListener("click",()=>{

if(!currentPatient) return;

document.querySelectorAll(".result-input").forEach(inp=>{

SuryaDB.saveResult(
currentPatient.id,
inp.dataset.test,
inp.value.trim()
);

});

alert("Results saved successfully.");

});

document.getElementById("printReportBtn").addEventListener("click",()=>{

window.print();

});

document.getElementById("downloadPdfBtn").addEventListener("click",async()=>{

const {jsPDF}=window.jspdf;

const canvas=await html2canvas(document.getElementById("ticket"));

const pdf=new jsPDF();

const img=canvas.toDataURL("image/png");

const w=190;
const h=canvas.height*w/canvas.width;

pdf.addImage(img,"PNG",10,10,w,h);

pdf.save(currentPatient.invoiceNo+"-report.pdf");

});

document.getElementById("whatsappBtn").addEventListener("click",()=>{

const msg=encodeURIComponent(
"Lab Report : "+currentPatient.name+
" ("+currentPatient.invoiceNo+")"
);

window.open(
"https://wa.me/?text="+msg,
"_blank"
);

});

const patientId=new URLSearchParams(location.search).get("patient");

if(patientId){

loadPatient(patientId);

}

</script>

</body>
</html>
